    <div class="ref">사이트 기준: ${ref}</div>
  `;
  cardsEl.appendChild(card);

  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  wrap.innerHTML = `<h3>${s.univ} — ${s.unit_name} 시간 변화</h3><canvas id="chart_${key}"></canvas>`;
  chartsEl.appendChild(wrap);

  const labels = s.points.map(p => p.t.replace('T', ' ').slice(0, 16));
  new Chart(document.getElementById('chart_' + key), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '지원인원',
          data: s.points.map(p => p.applied),
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59,130,246,0.1)',
          yAxisID: 'y',
          tension: 0.2,
        },
        {
          label: '경쟁률',
          data: s.points.map(p => p.ratio_value),
          borderColor: '#d94a4a',
          backgroundColor: 'rgba(217,74,74,0.1)',
          yAxisID: 'y1',
          tension: 0.2,
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y:  { type: 'linear', position: 'left',
              title: { display: true, text: '지원인원' } },
        y1: { type: 'linear', position: 'right',
              title: { display: true, text: '경쟁률' },
              grid: { drawOnChartArea: false } },
      },
    },
  });
});

// 이력 테이블
const hist = document.getElementById('history');
if (!DATA.history.length) {
  hist.innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.</div>';
} else {
  const cols = ['collected_at', 'site_ref_time', 'univ', 'type_name', 'unit_name',
                'recruit', 'applied', 'ratio_text'];
  const labels = ['수집시각', '사이트기준시각', '대학', '전형', '모집단위',
                  '모집인원', '지원인원', '경쟁률'];
  let html = '<table><thead><tr>';
  labels.forEach(l => html += `<th>${l}</th>`);
  html += '</tr></thead><tbody>';
  DATA.history.forEach(r => {
    html += '<tr>';
    cols.forEach(c => html += `<td>${r[c] ?? ''}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  hist.innerHTML = html;
}
</script>
</body>
</html>
