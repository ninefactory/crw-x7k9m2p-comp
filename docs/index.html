// Chart.js 다크모드/색상 반응형 세팅
const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const lineBlue = cssVar('--line-blue')    || (isDark ? '#7cb0ff' : '#2563eb');
const lineRed  = cssVar('--line-red')     || (isDark ? '#ff8f8f' : '#c92a2a');
const lineBlueBg = cssVar('--line-blue-bg') || (isDark ? 'rgba(124,176,255,0.18)' : 'rgba(37,99,235,0.10)');
const lineRedBg  = cssVar('--line-red-bg')  || (isDark ? 'rgba(255,143,143,0.18)' : 'rgba(201,42,42,0.10)');
Chart.defaults.color = isDark ? '#d4d8e2' : '#333';
Chart.defaults.borderColor = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.08)';
Chart.defaults.font.size = 12;

const cardsEl = document.getElementById('cards');
const chartsEl = document.getElementById('charts');

Object.entries(DATA.series).forEach(([key, s]) => {
  const latest = s.points.length ? s.points[s.points.length - 1] : null;
  const recruit = latest ? latest.recruit : '-';
  const applied = latest ? latest.applied : '-';
  const ratio = latest ? latest.ratio_text : '-';
  const ref = latest ? latest.ref : '데이터 없음';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>${s.univ}</h2>
    <div class="sub">${s.type_name} · ${s.unit_name}</div>
    <div class="metrics">
      <div class="metric"><div class="label">모집인원</div><div class="value">${recruit}</div></div>
      <div class="metric"><div class="label">지원인원</div><div class="value">${applied}</div></div>
      <div class="metric rate"><div class="label">경쟁률</div><div class="value">${ratio}</div></div>
    </div>
    <div class="ref">사이트 기준: ${ref}</div>
  `;
  cardsEl.appendChild(card);

  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  wrap.innerHTML = `<h3>${s.univ} — ${s.unit_name} 시간 변화</h3><canvas id="chart_${key}"></canvas>`;
  chartsEl.appendChild(wrap);

  const labels = s.points.map(p => p.t.replace('T', ' ').slice(0, 16));
  new Chart(document.getElementById('chart_' + key), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '지원인원',
          data: s.points.map(p => p.applied),
          borderColor: lineBlue,
          backgroundColor: lineBlueBg,
          yAxisID: 'y',
          tension: 0.2,
        },
        {
          label: '경쟁률',
          data: s.points.map(p => p.ratio_value),
          borderColor: lineRed,
          backgroundColor: lineRedBg,
          yAxisID: 'y1',
          tension: 0.2,
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      scales: {
        y:  { type: 'linear', position: 'left',
              title: { display: true, text: '지원인원' } },
        y1: { type: 'linear', position: 'right',
              title: { display: true, text: '경쟁률' },
              grid: { drawOnChartArea: false } },
      },
    },
  });
});

// 이력 테이블
const hist = document.getElementById('history');
if (!DATA.history.length) {
  hist.innerHTML = '<div class="empty">아직 수집된 데이터가 없습니다.</div>';
} else {
  const cols = ['collected_at', 'site_ref_time', 'univ', 'type_name', 'unit_name',
                'recruit', 'applied', 'ratio_text'];
  const labels = ['수집시각', '사이트기준시각', '대학', '전형', '모집단위',
                  '모집인원', '지원인원', '경쟁률'];
  let html = '<div class="table-wrap"><table><thead><tr>';
  labels.forEach(l => html += `<th>${l}</th>`);
  html += '</tr></thead><tbody>';
  DATA.history.forEach(r => {
    html += '<tr>';
    cols.forEach(c => html += `<td>${r[c] ?? ''}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table></div>';
  hist.innerHTML = html;
}
